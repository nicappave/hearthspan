; Hand-authored per CLAUDE.md / docs/development-plan-v2.md §6 Stage 6 task 5 — there is no
; interactive editor session available in this environment to generate this file the normal way
; (Project > Export dialog). Unlike .uid files or .tscn transforms (which are meant to be
; machine-generated and easy to get subtly wrong by hand), export_presets.cfg is a plain,
; documented, human-editable INI-style config in normal Godot usage — hand-authoring it is a
; reasonably normal workflow, not an exception to this project's "never hand-write generated
; files" instinct.
;
; Every key/section name and default value below was verified against the actual Godot 4.5.2-stable
; engine source at tag 4.5.2-stable (not guessed/recalled from memory), specifically:
;   - editor/export/editor_export.cpp (EditorExport::save_presets — the [preset.N] top-level keys
;     and the "preset.N.options" section name)
;   - editor/export/editor_export_preset.h (ScriptExportMode enum — script_export_mode=2 is
;     MODE_SCRIPT_BINARY_TOKENS_COMPRESSED, the engine's own default)
;   - editor/export/editor_export_platform_pc.cpp (the generic desktop options: custom_template/*,
;     debug/export_console_wrapper, binary_format/embed_pck, texture_format/*, shader_baker/enabled)
;   - platform/windows/export/export_plugin.cpp (Windows-specific options: binary_format/architecture,
;     codesign/*, application/*, ssh_remote_deploy/*)
;   - modules/mono/editor/GodotTools/GodotTools/Export/ExportPlugin.cs (the dotnet/* keys)
;   - modules/mono/editor/GodotTools/GodotTools/Build/BuildSystem.cs — confirms `dotnet publish`
;     is invoked with `-r <rid> --self-contained true` UNCONDITIONALLY for any .NET/mono export.
;     There is no "self-contained" toggle to set here because Godot's own .NET export pipeline
;     never produces anything else — this file's dotnet/* keys only control which build outputs get
;     embedded into the .pck vs left as loose files next to the exe, not whether the .NET runtime
;     itself ships. That satisfies task 2's "target machine needs no separate .NET runtime install"
;     requirement by construction, not by a setting.

